# Halo（自维护分叉）部署示例
#   1) cp halo.env.example halo.env && chmod 600 halo.env   # 改掉数据库密码与外部地址
#   2) docker compose --env-file halo.env up -d
services:
  halo:
    image: ghcr.io/zhemed/halo:v2.26.1-custom.1
    container_name: halo
    restart: unless-stopped
    depends_on:
      halodb:
        condition: service_healthy
    networks:
      halo_network:
    volumes:
      - ./halo2:/root/.halo2          # 站点数据（含密钥、附件、备份），必须持久化
    ports:
      - "0.0.0.0:8090:8090"           # 只在本机用可改成 "127.0.0.1:8090:8090"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:8090/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      # 内存吃紧可下调；官方默认 -Xmx256m -Xms256m
      - JVM_OPTS=-Xms256m -Xmx525m
    command:
      - --spring.r2dbc.url=r2dbc:pool:postgresql://halodb/halo
      - --spring.r2dbc.username=halo
      - --spring.r2dbc.password=${HALO_DB_PASSWORD}
      - --spring.sql.init.platform=postgresql
      # 外部访问地址：初始化前必须确定，影响站点链接生成
      - --halo.external-url=${HALO_EXTERNAL_URL}

  halodb:
    image: postgres:15.4
    container_name: halodb
    restart: unless-stopped
    networks:
      halo_network:
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_PASSWORD=${HALO_DB_PASSWORD}
      - POSTGRES_USER=halo
      - POSTGRES_DB=halo
      - PGUSER=halo

networks:
  halo_network:
